name: CI

on:
  - pull_request
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    name: Build linux-${{ matrix.compiler }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build dev shell environment
        run: nix develop .#ci --command true
      
      - name: Configure and build
        run: |
          nix develop .#ci --command cmake --preset linux-${{ matrix.compiler }}-debug
          nix develop .#ci --command cmake --build --preset linux-${{ matrix.compiler }}-debug

